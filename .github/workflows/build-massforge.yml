name: Build MASSFORGE Stable APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore persistent debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: massforge-debug-keystore-v1

      - name: Check JavaScript syntax
        run: |
          node --check app/src/main/assets/data.js
          node --check app/src/main/assets/goal.js
          node --check app/src/main/assets/app.js
          node --check app/src/main/assets/meal-picker.js

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload MASSFORGE APK
        uses: actions/upload-artifact@v4
        with:
          name: MASSFORGE-Stable-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
